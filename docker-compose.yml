version: '3.8'

services:
  # Service Backend (Spring Boot)
  backend:
    container_name: backend_spring_erp
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/test
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: adm@123
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - db
    networks:
      - app

  # Service Database (PostgreSQL)
  db:
    container_name: db_postgres_erp
    image: postgres:16.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: adm@123
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app

  # Service Frontend (React + TypeScript)
  frontend:
    container_name: frontend_react_erp
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app

# Définition des volumes et réseaux
volumes:
  db:

networks:
  app:
    driver: bridge